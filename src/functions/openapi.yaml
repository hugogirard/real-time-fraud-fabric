openapi: 3.0.3
info:
  title: Real-Time Fraud Detection API
  description: API for real-time fraud detection powered by a Foundry agent.
  version: 1.0.0

paths:
  /api/session/new:
    get:
      operationId: newSession
      summary: Create a new chat session
      description: Returns a new session with identifiers for the fraud detection agent.
      responses:
        "200":
          description: Successful response with the new session info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "500":
          description: Internal server error.
      security:
        - functionKey: []

  /api/conversation:
    post:
      operationId: conversation
      summary: Send a prompt to the fraud detection agent
      description: Accepts a conversation object and returns the agent's response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Conversation"
      responses:
        "200":
          description: Successful response with the agent's reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Bad request — missing or invalid JSON body.
        "500":
          description: Internal server error.
      security:
        - functionKey: []

components:
  schemas:
    SessionInfo:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: The unique session identifier.
        serviceSessionId:
          type: string
          nullable: true
          description: The service-side session identifier (optional).

    Conversation:
      type: object
      required:
        - sessionInfo
      properties:
        prompt:
          type: string
          nullable: true
          description: The prompt to send to the fraud detection agent.
        answer:
          type: string
          nullable: true
          description: The agent's response.
        sessionInfo:
          $ref: "#/components/schemas/SessionInfo"

  securitySchemes:
    functionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Function key for authentication.
