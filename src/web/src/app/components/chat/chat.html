<main class="chat-main">

    <loading [isLoading]="isLoading()" [title]="loadingTitle" />

    <!-- Chat Header -->
    <div id="chat-header" class="chat-header">
        <div class="chat-header-title">
            <div class="chat-brand">
                <div class="chat-brand-icon">
                    <img src="images/shield.svg" alt="Shield icon" />
                </div>
                <span>Contoso Bank</span>
            </div>
        </div>
        <div class="chat-header-actions">
            <div class="chat-user-info">
                <div class="chat-user-details">
                    <span class="chat-user-name">{{username}}</span>
                </div>
                <div class="chat-user-avatar">{{initial}}</div>
                <button class="chat-logout-btn" title="Sign out">
                    <img src="images/logout-icon.svg" alt="Sign out icon" />
                    <span>Sign out</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div id="chat-messages" class="chat-messages">

        <!-- Message list -->
        <div id="message-list">
            @for (msg of messages(); track msg.id) {
            <div class="message" [class.bot]="msg.role === Role.Assistant" [class.user]="msg.role === Role.User">
                <div class="message-avatar">{{ msg.role === Role.Assistant ? 'CB' : 'JD' }}</div>
                <div class="message-content">
                    <div class="message-bubble">{{ msg.text }}</div>
                    <span class="message-time">{{ msg.createdAt | date:'shortTime' }}</span>
                </div>
            </div>
            }
        </div>

        <!-- Typing indicator -->
        @if (isTyping()) {
        <div id="typing-indicator" class="typing-indicator visible">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
        }
    </div>

    <!-- Chat Input -->
    <div id="chat-input-area" class="chat-input-area">
        <div class="chat-input-wrapper">
            <textarea id="chat-input" class="chat-input" rows="1" placeholder="Type your message…"
                aria-label="Type your message"></textarea>
            <button id="send-btn" class="chat-send-btn" title="Send message">
                <img src="images/send-icon.svg" alt="Send" />
            </button>
        </div>
        <div class="chat-input-hint">
            Contoso Bank Fraud Assistant – powered by AI
        </div>
    </div>

</main>
