# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Name of the application.
name: fraud-detection
metadata:
  template: fraud-detection-agents@1.0.0

services:
  function:
    project: ./src/functions
    language: python
    host: function

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    posix:
      shell: sh
      run: ./scripts/pre-hook.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/pre-hook.ps1
      continueOnError: false

  postprovision:
    posix:
      shell: sh
      run: ./scripts/post-hook.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/post-hook.ps1
      continueOnError: false
