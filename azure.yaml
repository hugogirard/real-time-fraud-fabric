# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Name of the application.
name: fraud-detection
metadata:
  template: fraud-detection-agents@1.0.0

# services:
#   web:
#     project: ./src/web
#     language: docker
#     host: appservice
#     docker:
#       path: ./Dockerfile
#       registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    posix:
      shell: sh
      run: azd env set USER_PRINCIPAL_ID $(az ad signed-in-user show --query id -o tsv)
      continueOnError: false
    windows:
      shell: pwsh
      run: azd env set USER_PRINCIPAL_ID $(az ad signed-in-user show --query id -o tsv)
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      run: ./scripts/deploy-apps.ps1
